[project]
name = "detection-and-recognition-from-aerial-drones-fyp"
version = "0.1.0"
description = "UV-managed environment for DroneRGBT training, inference, and tooling"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib==3.10.7",
    "numpy==2.2.6",
    "opencv-python==4.11.0.86",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pycocotools==2.0.10",
    "pyyaml==6.0.3",
    "timm==1.0.22",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
yolo = [
    "ultralytics==8.4.13",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
